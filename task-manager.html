<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Opus — Task Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Epilogue:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

:root{
  --bg:#0E0E11;
  --surface:#16161A;
  --surface2:#1E1E24;
  --surface3:#26262E;
  --border:rgba(255,255,255,0.07);
  --border2:rgba(255,255,255,0.12);
  --text:#F0EEF8;
  --text2:#9A98AA;
  --text3:#5C5A6A;
  --accent:#C8B8FF;
  --accent-dim:#7B6CC4;
  --accent-bg:rgba(200,184,255,0.08);
  --green:#6EE7B7;
  --green-bg:rgba(110,231,183,0.08);
  --amber:#FCD34D;
  --amber-bg:rgba(252,211,77,0.08);
  --red:#F87171;
  --red-bg:rgba(248,113,113,0.08);
  --blue:#93C5FD;
  --blue-bg:rgba(147,197,253,0.08);
  --radius:10px;
  --radius-lg:16px;
  --radius-xl:22px;
}

html{font-size:15px;}
body{
  font-family:'Epilogue',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* ── BACKGROUND GLOW ── */
body::before{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 50% 40% at 5% 0%,rgba(123,108,196,0.15) 0%,transparent 60%),
    radial-gradient(ellipse 30% 30% at 95% 90%,rgba(110,231,183,0.06) 0%,transparent 60%);
  pointer-events:none;z-index:0;
}

/* ── LAYOUT ── */
.app{position:relative;z-index:1;display:flex;height:100vh;overflow:hidden;}

/* ── SIDEBAR ── */
aside{
  width:240px;flex-shrink:0;
  background:var(--surface);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  padding:0;overflow:hidden;
}
.sidebar-top{padding:28px 20px 20px;}
.logo{font-family:'Playfair Display',serif;font-size:22px;color:var(--text);letter-spacing:-0.02em;margin-bottom:28px;}
.logo span{color:var(--accent);}

.nav-section-label{font-size:10px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);margin:0 20px 8px;padding-top:16px;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 20px;
  cursor:pointer;
  font-size:13px;color:var(--text2);
  border-left:2px solid transparent;
  transition:all 0.15s;
}
.nav-item:hover{color:var(--text);background:var(--surface2);}
.nav-item.active{color:var(--accent);border-left-color:var(--accent);background:var(--accent-bg);}
.nav-item svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.nav-count{margin-left:auto;font-size:11px;background:var(--surface3);color:var(--text3);padding:1px 7px;border-radius:20px;}
.nav-item.active .nav-count{background:var(--accent-bg);color:var(--accent);}

.cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

.sidebar-bottom{margin-top:auto;padding:16px 20px;border-top:1px solid var(--border);}
.progress-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-bottom:8px;}
.progress-bar{height:4px;background:var(--surface3);border-radius:2px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent-dim),var(--accent));border-radius:2px;transition:width 0.5s ease;}
.done-label{font-size:12px;color:var(--text2);margin-top:8px;}
.done-label strong{color:var(--text);font-weight:500;}

/* ── MAIN ── */
main{flex:1;display:flex;flex-direction:column;overflow:hidden;}

.topbar{
  padding:20px 28px 0;
  border-bottom:1px solid var(--border);
  background:var(--bg);
  flex-shrink:0;
}
.topbar-row{display:flex;align-items:center;gap:12px;padding-bottom:20px;}
.page-title{font-family:'Playfair Display',serif;font-size:26px;font-weight:600;letter-spacing:-0.02em;flex:1;}
.page-title em{font-style:italic;color:var(--accent);}

.search-wrap{position:relative;}
.search-input{
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:9px 12px 9px 36px;
  font-family:'Epilogue',sans-serif;
  font-size:13px;color:var(--text);
  width:220px;outline:none;
  transition:border-color 0.2s,width 0.3s;
}
.search-input::placeholder{color:var(--text3);}
.search-input:focus{border-color:var(--accent-dim);width:260px;}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--text3);fill:none;stroke-width:2;stroke-linecap:round;}

.btn-add{
  display:flex;align-items:center;gap:7px;
  background:var(--accent);color:#0E0E11;
  border:none;border-radius:var(--radius);
  padding:10px 16px;
  font-family:'Epilogue',sans-serif;font-size:13px;font-weight:500;
  cursor:pointer;transition:all 0.2s;white-space:nowrap;
}
.btn-add:hover{background:#b5a2f5;transform:translateY(-1px);}
.btn-add svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;}

/* Filter pills */
.filter-row{display:flex;gap:8px;padding-bottom:0;overflow-x:auto;scrollbar-width:none;}
.filter-row::-webkit-scrollbar{display:none;}
.filter-pill{
  padding:6px 14px;border-radius:20px;
  font-size:12px;font-weight:500;
  border:1px solid var(--border);
  background:transparent;color:var(--text2);
  cursor:pointer;white-space:nowrap;
  transition:all 0.15s;font-family:'Epilogue',sans-serif;
}
.filter-pill:hover{border-color:var(--border2);color:var(--text);}
.filter-pill.active{background:var(--accent-bg);border-color:var(--accent-dim);color:var(--accent);}

/* Sort row */
.sort-row{
  display:flex;align-items:center;gap:12px;
  padding:12px 28px;border-bottom:1px solid var(--border);
  font-size:12px;color:var(--text3);flex-shrink:0;
}
.sort-row select{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:6px;color:var(--text2);
  padding:5px 10px;font-family:'Epilogue',sans-serif;font-size:12px;
  cursor:pointer;outline:none;
}
.sort-row select:focus{border-color:var(--accent-dim);}
.task-count-label{margin-left:auto;color:var(--text3);font-size:12px;}

/* ── TASK LIST ── */
.task-area{flex:1;overflow-y:auto;padding:20px 28px;scrollbar-width:thin;scrollbar-color:var(--surface3) transparent;}
.task-area::-webkit-scrollbar{width:4px;}
.task-area::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:2px;}

.empty-state{
  text-align:center;padding:60px 20px;color:var(--text3);
}
.empty-state svg{width:40px;height:40px;stroke:var(--text3);fill:none;stroke-width:1.5;margin-bottom:16px;opacity:0.4;}
.empty-state p{font-size:14px;}

.group-label{
  font-size:10px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;
  color:var(--text3);margin:20px 0 10px;
}
.group-label:first-child{margin-top:0;}

.task-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:14px 16px;
  margin-bottom:8px;
  display:flex;align-items:flex-start;gap:12px;
  transition:all 0.2s;
  animation:slideIn 0.2s ease both;
}
@keyframes slideIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.task-card:hover{border-color:var(--border2);background:var(--surface2);}
.task-card.done{opacity:0.45;}

.task-check{
  width:20px;height:20px;border-radius:6px;
  border:1.5px solid var(--border2);
  background:transparent;
  cursor:pointer;flex-shrink:0;margin-top:1px;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.2s;
}
.task-check:hover{border-color:var(--accent-dim);background:var(--accent-bg);}
.task-check.checked{background:var(--accent);border-color:var(--accent);}
.task-check svg{width:11px;height:11px;stroke:#0E0E11;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;display:none;}
.task-check.checked svg{display:block;}

.task-body{flex:1;min-width:0;}
.task-title{
  font-size:14px;color:var(--text);line-height:1.4;
  transition:color 0.2s;word-break:break-word;
}
.task-card.done .task-title{text-decoration:line-through;color:var(--text3);}
.task-meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:7px;}

.tag{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;padding:3px 9px;border-radius:20px;font-weight:500;
}
.tag.cat{background:var(--surface3);color:var(--text2);}
.tag.cat .dot{width:6px;height:6px;border-radius:50%;}

.priority-badge{
  font-size:10px;font-weight:500;padding:2px 8px;border-radius:20px;
  text-transform:uppercase;letter-spacing:0.06em;
}
.priority-badge.high{background:var(--red-bg);color:var(--red);}
.priority-badge.medium{background:var(--amber-bg);color:var(--amber);}
.priority-badge.low{background:var(--green-bg);color:var(--green);}

.due-tag{
  font-size:11px;color:var(--text3);
  display:flex;align-items:center;gap:4px;
}
.due-tag svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;}
.due-tag.overdue{color:var(--red);}
.due-tag.today{color:var(--amber);}
.due-tag.soon{color:var(--accent);}

.task-actions{display:flex;gap:4px;opacity:0;transition:opacity 0.15s;}
.task-card:hover .task-actions{opacity:1;}
.icon-btn{
  width:28px;height:28px;border-radius:7px;
  background:transparent;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.15s;color:var(--text3);
}
.icon-btn:hover{background:var(--surface3);color:var(--text);}
.icon-btn.del:hover{background:var(--red-bg);color:var(--red);}
.icon-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

/* ── MODAL ── */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.65);
  display:flex;align-items:center;justify-content:center;
  z-index:100;padding:20px;
  opacity:0;pointer-events:none;transition:opacity 0.2s;
}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal{
  background:var(--surface);
  border:1px solid var(--border2);
  border-radius:var(--radius-xl);
  padding:28px;width:100%;max-width:480px;
  transform:translateY(10px);transition:transform 0.2s;
}
.modal-overlay.open .modal{transform:translateY(0);}
.modal-title{font-family:'Playfair Display',serif;font-size:20px;margin-bottom:22px;}

.field{margin-bottom:16px;}
.field label{display:block;font-size:11px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--text3);margin-bottom:6px;}
.field input,.field select,.field textarea{
  width:100%;background:var(--surface2);
  border:1px solid var(--border);border-radius:var(--radius);
  padding:10px 14px;color:var(--text);
  font-family:'Epilogue',sans-serif;font-size:14px;
  outline:none;transition:border-color 0.2s;
}
.field input::placeholder,.field textarea::placeholder{color:var(--text3);}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent-dim);}
.field textarea{resize:vertical;min-height:80px;line-height:1.6;}
.field select option{background:var(--surface2);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px;}
.btn-cancel{
  padding:10px 20px;border-radius:var(--radius);
  background:transparent;border:1px solid var(--border2);
  color:var(--text2);font-family:'Epilogue',sans-serif;font-size:13px;
  cursor:pointer;transition:all 0.15s;
}
.btn-cancel:hover{border-color:var(--border2);color:var(--text);}
.btn-save{
  padding:10px 24px;border-radius:var(--radius);
  background:var(--accent);color:#0E0E11;
  border:none;font-family:'Epilogue',sans-serif;font-size:13px;font-weight:500;
  cursor:pointer;transition:all 0.2s;
}
.btn-save:hover{background:#b5a2f5;}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:28px;right:28px;
  background:var(--surface2);border:1px solid var(--border2);
  border-radius:var(--radius);padding:12px 18px;
  font-size:13px;color:var(--text);
  z-index:200;
  transform:translateY(12px);opacity:0;
  transition:all 0.3s;pointer-events:none;
}
.toast.show{opacity:1;transform:translateY(0);}
</style>
</head>
<body>
<div class="app">

<!-- ── SIDEBAR ── -->
<aside>
  <div class="sidebar-top">
    <div class="logo">Op<span>u</span>s</div>

    <div class="nav-section-label">Views</div>
    <div class="nav-item active" onclick="setView('all',this)" id="nav-all">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      All Tasks <span class="nav-count" id="count-all">0</span>
    </div>
    <div class="nav-item" onclick="setView('today',this)" id="nav-today">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      Today <span class="nav-count" id="count-today">0</span>
    </div>
    <div class="nav-item" onclick="setView('upcoming',this)" id="nav-upcoming">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      Upcoming <span class="nav-count" id="count-upcoming">0</span>
    </div>
    <div class="nav-item" onclick="setView('done',this)" id="nav-done">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      Completed <span class="nav-count" id="count-done">0</span>
    </div>

    <div class="nav-section-label">Categories</div>
    <div class="nav-item" onclick="setView('cat-Work',this)" id="nav-cat-Work">
      <span class="cat-dot" style="background:#93C5FD"></span>Work
      <span class="nav-count" id="count-cat-Work">0</span>
    </div>
    <div class="nav-item" onclick="setView('cat-Personal',this)" id="nav-cat-Personal">
      <span class="cat-dot" style="background:#C8B8FF"></span>Personal
      <span class="nav-count" id="count-cat-Personal">0</span>
    </div>
    <div class="nav-item" onclick="setView('cat-Health',this)" id="nav-cat-Health">
      <span class="cat-dot" style="background:#6EE7B7"></span>Health
      <span class="nav-count" id="count-cat-Health">0</span>
    </div>
    <div class="nav-item" onclick="setView('cat-Learning',this)" id="nav-cat-Learning">
      <span class="cat-dot" style="background:#FCD34D"></span>Learning
      <span class="nav-count" id="count-cat-Learning">0</span>
    </div>
  </div>

  <div class="sidebar-bottom">
    <div class="progress-label">
      <span>Progress</span><span id="pct-label">0%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <div class="done-label"><strong id="done-count">0</strong> of <strong id="total-count">0</strong> tasks done</div>
  </div>
</aside>

<!-- ── MAIN ── -->
<main>
  <div class="topbar">
    <div class="topbar-row">
      <div class="page-title" id="page-title">All <em>Tasks</em></div>
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="search-input" type="text" placeholder="Search tasks…" id="search-input" oninput="render()"/>
      </div>
      <button class="btn-add" onclick="openModal()">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Task
      </button>
    </div>
    <div class="filter-row" id="filter-row">
      <button class="filter-pill active" onclick="setPriority('all',this)">All</button>
      <button class="filter-pill" onclick="setPriority('high',this)">🔴 High</button>
      <button class="filter-pill" onclick="setPriority('medium',this)">🟡 Medium</button>
      <button class="filter-pill" onclick="setPriority('low',this)">🟢 Low</button>
    </div>
    <div style="height:14px"></div>
  </div>

  <div class="sort-row">
    <span>Sort by</span>
    <select id="sort-select" onchange="render()">
      <option value="created">Date created</option>
      <option value="due">Due date</option>
      <option value="priority">Priority</option>
      <option value="title">Title</option>
    </select>
    <span class="task-count-label" id="count-label"></span>
  </div>

  <div class="task-area" id="task-area"></div>
</main>
</div>

<!-- ── MODAL ── -->
<div class="modal-overlay" id="modal-overlay" onclick="overlayClick(event)">
  <div class="modal">
    <div class="modal-title" id="modal-title">New Task</div>
    <div class="field">
      <label>Task title</label>
      <input type="text" id="f-title" placeholder="What needs to be done?"/>
    </div>
    <div class="field">
      <label>Notes (optional)</label>
      <textarea id="f-notes" placeholder="Add more details…"></textarea>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Category</label>
        <select id="f-cat">
          <option>Work</option>
          <option>Personal</option>
          <option>Health</option>
          <option>Learning</option>
        </select>
      </div>
      <div class="field">
        <label>Priority</label>
        <select id="f-priority">
          <option value="high">High</option>
          <option value="medium" selected>Medium</option>
          <option value="low">Low</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Due date</label>
      <input type="date" id="f-due"/>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveTask()">Save Task</button>
    </div>
  </div>
</div>

<!-- ── TOAST ── -->
<div class="toast" id="toast"></div>

<script>
const CAT_COLORS = {Work:'#93C5FD',Personal:'#C8B8FF',Health:'#6EE7B7',Learning:'#FCD34D'};
const PRIORITY_ORDER = {high:0,medium:1,low:2};

let tasks = JSON.parse(localStorage.getItem('opus_tasks')||'[]');
let currentView = 'all';
let currentPriority = 'all';
let editingId = null;

// Seed demo tasks if empty
if(!tasks.length){
  const today = new Date();
  const fmt = d=>{const t=new Date(today);t.setDate(t.getDate()+d);return t.toISOString().split('T')[0];};
  tasks=[
    {id:1,title:'Finalize portfolio case study',notes:'Include screenshots and process notes',cat:'Work',priority:'high',due:fmt(0),done:false,created:Date.now()-86400000*3},
    {id:2,title:'Morning run — 5km',notes:'',cat:'Health',priority:'medium',due:fmt(0),done:true,created:Date.now()-86400000*2},
    {id:3,title:'Read "The Design of Everyday Things"',notes:'Chapters 3-4 today',cat:'Learning',priority:'low',due:fmt(2),done:false,created:Date.now()-86400000*1},
    {id:4,title:'Client feedback call',notes:'Prepare updated mockups beforehand',cat:'Work',priority:'high',due:fmt(1),done:false,created:Date.now()-86400000*1},
    {id:5,title:'Grocery run',notes:'Focus on whole foods',cat:'Personal',priority:'low',due:fmt(3),done:false,created:Date.now()},
    {id:6,title:'Push updated components to GitHub',notes:'',cat:'Work',priority:'medium',due:fmt(-1),done:false,created:Date.now()-86400000*4},
  ];
  save();
}

function save(){localStorage.setItem('opus_tasks',JSON.stringify(tasks));}

function dueDiff(due){
  if(!due) return null;
  const now = new Date(); now.setHours(0,0,0,0);
  const d = new Date(due+'T00:00:00');
  return Math.round((d-now)/(1000*60*60*24));
}

function dueLabel(due){
  const diff = dueDiff(due);
  if(diff===null) return null;
  if(diff<0) return {text:'Overdue '+Math.abs(diff)+'d', cls:'overdue'};
  if(diff===0) return {text:'Due today', cls:'today'};
  if(diff===1) return {text:'Tomorrow', cls:'soon'};
  if(diff<=7) return {text:'In '+diff+' days', cls:''};
  return {text:new Date(due+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}), cls:''};
}

function getFiltered(){
  const search = document.getElementById('search-input').value.toLowerCase();
  const today = new Date(); today.setHours(0,0,0,0);

  return tasks.filter(t=>{
    if(search && !t.title.toLowerCase().includes(search) && !t.notes.toLowerCase().includes(search)) return false;
    if(currentPriority!=='all' && t.priority!==currentPriority) return false;
    if(currentView==='done') return t.done;
    if(currentView==='today'){
      const diff=dueDiff(t.due);
      return !t.done && diff!==null && diff<=0 && diff>-7;
    }
    if(currentView==='upcoming'){
      const diff=dueDiff(t.due);
      return !t.done && diff!==null && diff>0;
    }
    if(currentView.startsWith('cat-')){
      const cat=currentView.slice(4);
      return t.cat===cat && !t.done;
    }
    return true; // 'all'
  });
}

function getSorted(list){
  const s = document.getElementById('sort-select').value;
  return [...list].sort((a,b)=>{
    if(s==='due'){
      if(!a.due&&!b.due) return 0;
      if(!a.due) return 1; if(!b.due) return -1;
      return a.due.localeCompare(b.due);
    }
    if(s==='priority') return PRIORITY_ORDER[a.priority]-PRIORITY_ORDER[b.priority];
    if(s==='title') return a.title.localeCompare(b.title);
    return b.created-a.created;
  });
}

function updateCounts(){
  const total = tasks.length;
  const done = tasks.filter(t=>t.done).length;
  const pct = total?Math.round(done/total*100):0;
  document.getElementById('done-count').textContent=done;
  document.getElementById('total-count').textContent=total;
  document.getElementById('pct-label').textContent=pct+'%';
  document.getElementById('progress-fill').style.width=pct+'%';

  const todayDiff = t=>{const d=dueDiff(t.due);return d!==null&&d<=0&&d>-7&&!t.done;};
  document.getElementById('count-all').textContent=tasks.filter(t=>!t.done).length;
  document.getElementById('count-today').textContent=tasks.filter(todayDiff).length;
  document.getElementById('count-upcoming').textContent=tasks.filter(t=>!t.done&&dueDiff(t.due)>0).length;
  document.getElementById('count-done').textContent=done;
  ['Work','Personal','Health','Learning'].forEach(c=>{
    document.getElementById('count-cat-'+c).textContent=tasks.filter(t=>t.cat===c&&!t.done).length;
  });
}

function render(){
  updateCounts();
  const list = getSorted(getFiltered());
  const area = document.getElementById('task-area');
  document.getElementById('count-label').textContent=list.length+' task'+(list.length!==1?'s':'');

  if(!list.length){
    area.innerHTML=`<div class="empty-state">
      <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <p>No tasks here — great job or add one!</p>
    </div>`;
    return;
  }

  // Group by date if sorting by due
  const sort = document.getElementById('sort-select').value;
  if(sort==='due'){
    const groups={};
    list.forEach(t=>{
      const diff=dueDiff(t.due);
      let grp='No due date';
      if(diff!==null){
        if(diff<0) grp='Overdue';
        else if(diff===0) grp='Today';
        else if(diff===1) grp='Tomorrow';
        else if(diff<=7) grp='This week';
        else grp='Later';
      }
      (groups[grp]=groups[grp]||[]).push(t);
    });
    const order=['Overdue','Today','Tomorrow','This week','Later','No due date'];
    area.innerHTML='';
    order.forEach(g=>{
      if(!groups[g]) return;
      const lbl=document.createElement('div');
      lbl.className='group-label';lbl.textContent=g;
      area.appendChild(lbl);
      groups[g].forEach(t=>area.appendChild(taskCard(t)));
    });
  } else {
    area.innerHTML='';
    list.forEach(t=>area.appendChild(taskCard(t)));
  }
}

function taskCard(t){
  const div=document.createElement('div');
  div.className='task-card'+(t.done?' done':'');

  const due=dueLabel(t.due);
  const dueHTML=due?`<span class="due-tag ${due.cls}"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>${due.text}</span>`:'';

  div.innerHTML=`
    <button class="task-check ${t.done?'checked':''}" onclick="toggleDone(${t.id})" aria-label="Toggle done">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    </button>
    <div class="task-body">
      <div class="task-title">${escHtml(t.title)}</div>
      <div class="task-meta">
        <span class="tag cat"><span class="dot" style="background:${CAT_COLORS[t.cat]||'#888'}"></span>${t.cat}</span>
        <span class="priority-badge ${t.priority}">${t.priority}</span>
        ${dueHTML}
      </div>
    </div>
    <div class="task-actions">
      <button class="icon-btn" onclick="editTask(${t.id})" aria-label="Edit">
        <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      </button>
      <button class="icon-btn del" onclick="deleteTask(${t.id})" aria-label="Delete">
        <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
      </button>
    </div>`;
  return div;
}

function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function toggleDone(id){
  const t=tasks.find(x=>x.id===id);
  if(!t) return;
  t.done=!t.done;
  save();render();
  showToast(t.done?'Task completed ✓':'Marked as pending');
}

function deleteTask(id){
  tasks=tasks.filter(x=>x.id!==id);
  save();render();
  showToast('Task deleted');
}

function editTask(id){
  const t=tasks.find(x=>x.id===id);
  if(!t) return;
  editingId=id;
  document.getElementById('modal-title').textContent='Edit Task';
  document.getElementById('f-title').value=t.title;
  document.getElementById('f-notes').value=t.notes||'';
  document.getElementById('f-cat').value=t.cat;
  document.getElementById('f-priority').value=t.priority;
  document.getElementById('f-due').value=t.due||'';
  document.getElementById('modal-overlay').classList.add('open');
}

function openModal(){
  editingId=null;
  document.getElementById('modal-title').textContent='New Task';
  document.getElementById('f-title').value='';
  document.getElementById('f-notes').value='';
  document.getElementById('f-cat').value='Work';
  document.getElementById('f-priority').value='medium';
  document.getElementById('f-due').value='';
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('f-title').focus(),100);
}

function closeModal(){document.getElementById('modal-overlay').classList.remove('open');}
function overlayClick(e){if(e.target===document.getElementById('modal-overlay')) closeModal();}

function saveTask(){
  const title=document.getElementById('f-title').value.trim();
  if(!title){document.getElementById('f-title').focus();return;}
  const data={
    title,
    notes:document.getElementById('f-notes').value.trim(),
    cat:document.getElementById('f-cat').value,
    priority:document.getElementById('f-priority').value,
    due:document.getElementById('f-due').value||null,
  };
  if(editingId){
    const t=tasks.find(x=>x.id===editingId);
    Object.assign(t,data);
    showToast('Task updated');
  } else {
    tasks.push({id:Date.now(),...data,done:false,created:Date.now()});
    showToast('Task added');
  }
  save();closeModal();render();
}

function setView(view,el){
  currentView=view;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  const titles={all:'All <em>Tasks</em>',today:'Due <em>Today</em>',upcoming:'<em>Upcoming</em>',done:'<em>Completed</em>'};
  let title=titles[view]||(view.startsWith('cat-')?view.slice(4)+' <em>Tasks</em>':'Tasks');
  document.getElementById('page-title').innerHTML=title;
  render();
}

function setPriority(p,el){
  currentPriority=p;
  document.querySelectorAll('.filter-pill').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
  render();
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2400);
}

// Keyboard shortcut
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();openModal();}
  if(e.key==='Escape') closeModal();
});

render();
</script>
</body>
</html>
