<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .nav-tabs {
            display: flex;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
        }

        .nav-tab {
            flex: 1;
            padding: 15px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            color: #6c757d;
            transition: all 0.3s ease;
        }

        .nav-tab.active {
            background: white;
            color: #2c3e50;
            border-bottom: 3px solid #667eea;
        }

        .nav-tab:hover {
            background: #e9ecef;
            color: #2c3e50;
        }

        .tab-content {
            display: none;
            padding: 30px;
        }

        .tab-content.active {
            display: block;
        }

        .form-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .form-section h3 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 1.3rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #495057;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-danger {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
        }

        .btn-success {
            background: linear-gradient(135deg, #27ae60, #229954);
        }

        .records-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .records-table th {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }

        .records-table td {
            padding: 15px;
            border-bottom: 1px solid #e9ecef;
        }

        .records-table tr:hover {
            background: #f8f9fa;
        }

        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-checked-in {
            background: #d4edda;
            color: #155724;
        }

        .status-checked-out {
            background: #f8d7da;
            color: #721c24;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.85rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .stat-label {
            opacity: 0.9;
            font-size: 1rem;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .nav-tabs {
                flex-direction: column;
            }
            
            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Visitor Management System</h1>
            <p>Streamline your visitor registration and tracking process</p>
        </div>

        <div class="nav-tabs">
            <button class="nav-tab active" onclick="showTab('register')">Register Visitor</button>
            <button class="nav-tab" onclick="showTab('records')">Visitor Records</button>
        </div>

        <!-- Register Visitor Tab -->
        <div id="register" class="tab-content active">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" id="totalVisitors">0</div>
                    <div class="stat-label">Total Visitors</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="checkedIn">0</div>
                    <div class="stat-label">Currently Checked In</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="todayVisitors">0</div>
                    <div class="stat-label">Today's Visitors</div>
                </div>
            </div>

            <div class="form-section">
                <h3>Visitor Registration</h3>
                <form id="visitorForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="visitorName">Full Name *</label>
                            <input type="text" id="visitorName" required>
                        </div>
                        <div class="form-group">
                            <label for="visitorPhone">Phone Number *</label>
                            <input type="tel" id="visitorPhone" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="visitorEmail">Email Address</label>
                            <input type="email" id="visitorEmail">
                        </div>
                        <div class="form-group">
                            <label for="visitorCompany">Company/Organization</label>
                            <input type="text" id="visitorCompany">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="visitPurpose">Purpose of Visit *</label>
                            <select id="visitPurpose" required>
                                <option value="">Select Purpose</option>
                                <option value="Business Meeting">Business Meeting</option>
                                <option value="Interview">Interview</option>
                                <option value="Delivery">Delivery</option>
                                <option value="Maintenance">Maintenance</option>
                                <option value="Personal Visit">Personal Visit</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="hostName">Host Name *</label>
                            <input type="text" id="hostName" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="visitNotes">Additional Notes</label>
                        <textarea id="visitNotes" rows="3" placeholder="Any additional information..."></textarea>
                    </div>
                    <button type="submit" class="btn">Check In Visitor</button>
                </form>
            </div>
        </div>

        <!-- Visitor Records Tab -->
        <div id="records" class="tab-content">
            <h3>Visitor Records</h3>
            <table class="records-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Purpose</th>
                        <th>Host</th>
                        <th>Check In</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="recordsTableBody">
                    <!-- Records will be populated here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let visitors = JSON.parse(localStorage.getItem('visitors')) || [];
        let visitorIdCounter = parseInt(localStorage.getItem('visitorIdCounter')) || 1;

        function showTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.classList.remove('active');
            });

            // Show selected tab
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');

            if (tabName === 'records') {
                displayRecords();
            }
        }

        function updateStats() {
            const totalVisitors = visitors.length;
            const checkedIn = visitors.filter(v => v.status === 'Checked In').length;
            const today = new Date().toDateString();
            const todayVisitors = visitors.filter(v => new Date(v.checkIn).toDateString() === today).length;

            document.getElementById('totalVisitors').textContent = totalVisitors;
            document.getElementById('checkedIn').textContent = checkedIn;
            document.getElementById('todayVisitors').textContent = todayVisitors;
        }

        function saveData() {
            localStorage.setItem('visitors', JSON.stringify(visitors));
            localStorage.setItem('visitorIdCounter', visitorIdCounter.toString());
        }

        document.getElementById('visitorForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const visitor = {
                id: visitorIdCounter++,
                name: document.getElementById('visitorName').value,
                phone: document.getElementById('visitorPhone').value,
                email: document.getElementById('visitorEmail').value,
                company: document.getElementById('visitorCompany').value,
                purpose: document.getElementById('visitPurpose').value,
                host: document.getElementById('hostName').value,
                notes: document.getElementById('visitNotes').value,
                checkIn: new Date().toISOString(),
                checkOut: null,
                status: 'Checked In'
            };

            visitors.push(visitor);
            saveData();
            updateStats();

            // Reset form
            this.reset();
            
            alert('Visitor checked in successfully!');
        });

        function checkOut(visitorId) {
            const visitor = visitors.find(v => v.id === visitorId);
            if (visitor) {
                visitor.checkOut = new Date().toISOString();
                visitor.status = 'Checked Out';
                saveData();
                updateStats();
                displayRecords();
                alert('Visitor checked out successfully!');
            }
        }

        function deleteRecord(visitorId) {
            if (confirm('Are you sure you want to delete this record?')) {
                visitors = visitors.filter(v => v.id !== visitorId);
                saveData();
                updateStats();
                displayRecords();
            }
        }

        function displayRecords() {
            const tbody = document.getElementById('recordsTableBody');
            tbody.innerHTML = '';

            visitors.forEach(visitor => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>
                        <strong>${visitor.name}</strong><br>
                        <small>${visitor.phone}</small>
                    </td>
                    <td>${visitor.purpose}</td>
                    <td>${visitor.host}</td>
                    <td>${new Date(visitor.checkIn).toLocaleString()}</td>
                    <td>
                        <span class="status-badge ${visitor.status === 'Checked In' ? 'status-checked-in' : 'status-checked-out'}">
                            ${visitor.status}
                        </span>
                    </td>
                    <td>
                        <div class="action-buttons">
                            ${visitor.status === 'Checked In' ? 
                                `<button class="btn btn-success btn-small" onclick="checkOut(${visitor.id})">Check Out</button>` : 
                                `<span class="text-muted">Checked out at ${new Date(visitor.checkOut).toLocaleString()}</span>`
                            }
                            <button class="btn btn-danger btn-small" onclick="deleteRecord(${visitor.id})">Delete</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        // Initialize
        updateStats();
        displayRecords();
    </script>
</body>
</html>
